<aside class="sidebar">

  <div class="sidebar-logo">
    <div class="logo-icon">I</div>
    <div>
      <p class="logo-name">Ingecys</p>
      <p class="logo-role">{{ auth.estAdmin() ? 'Administration' : 'Mon espace' }}</p>
    </div>
  </div>

  <nav class="sidebar-nav">

    <ng-container *ngIf="auth.estAdmin()">
      <p class="nav-section-label">Administration</p>
      <a routerLink="/admin/dashboard" routerLinkActive="nav-active" class="nav-item">
        <span class="nav-icon">⊞</span> Dashboard
      </a>
      <a routerLink="/objets/liste" routerLinkActive="nav-active" class="nav-item">
        <span class="nav-icon">📂</span> Tous les objets
      </a>
      <a routerLink="/admin/users" routerLinkActive="nav-active" class="nav-item">
        <span class="nav-icon">👥</span> Utilisateurs
      </a>
    </ng-container>

    <ng-container *ngIf="!auth.estAdmin()">
      <p class="nav-section-label">Mon espace</p>
      <a routerLink="/user/dashboard" routerLinkActive="nav-active" class="nav-item">
        <span class="nav-icon">🏠</span> Accueil
      </a>
      <a routerLink="/user/mes-objets" routerLinkActive="nav-active" class="nav-item">
        <span class="nav-icon">📂</span> Mes objets
      </a>
    </ng-container>

  </nav>

  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar">{{ auth.getEmail()?.charAt(0)?.toUpperCase() }}</div>
      <div class="user-details">
        <p class="user-email">{{ auth.getEmail() }}</p>
        <p class="user-role">{{ auth.getRole() }}</p>
      </div>
    </div>
    <button class="btn-logout" (click)="auth.deconnecter()">Déconnexion</button>
  </div>

</aside>
