<div class="layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="page-header">
      <h1>Tickets</h1>
      <button class="btn-primary" (click)="showModal = true">+ Nouveau ticket</button>
    </div>

    <!-- Filtres -->
    <div class="filtres">
      <input
        type="text"
        placeholder="Rechercher un ticket..."
        [(ngModel)]="recherche"
        (input)="filtrer()"
        class="input-recherche"
      />
      <select [(ngModel)]="filtreStatut" (change)="filtrer()">
        <option value="">Tous les statuts</option>
        <option value="OUVERT">Ouvert</option>
        <option value="EN_COURS">En cours</option>
        <option value="RESOLU">Résolu</option>
        <option value="FERME">Fermé</option>
      </select>
    </div>

    <!-- Tableau -->
    <div class="card">
      <div *ngIf="chargement" class="chargement">Chargement...</div>

      <table *ngIf="!chargement" class="tableau">
        <thead>
          <tr>
            <th>#</th>
            <th>Titre</th>
            <th>Description</th>
            <th>Priorité</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ticket of ticketsFiltres">
            <td class="id-col">#{{ ticket.id }}</td>
            <td class="titre-col">{{ ticket.title }}</td>
            <td class="desc-col">{{ ticket.description | slice:0:40 }}...</td>
            <td><span [class]="'badge ' + couleurPriorite(ticket.priority)">{{ ticket.priority }}</span></td>
            <td>
              <select
                [value]="ticket.status"
                (change)="changerStatut(ticket.id, $any($event.target).value)"
                class="select-statut"
              >
                <option value="OUVERT">Ouvert</option>
                <option value="EN_COURS">En cours</option>
                <option value="RESOLU">Résolu</option>
                <option value="FERME">Fermé</option>
              </select>
            </td>
            <td class="date-col">{{ ticket.created | date:'dd/MM/yy' }}</td>
            <td>
              <a [routerLink]="['/user/conversation', ticket.conversationId]" class="btn-action">
                Fil de discussion
              </a>
            </td>
          </tr>
          <tr *ngIf="ticketsFiltres.length === 0">
            <td colspan="7" class="vide">Aucun ticket trouvé.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal création ticket -->
<div class="modal-overlay" *ngIf="showModal" (click)="showModal = false">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Nouveau ticket</h2>
      <button class="btn-close" (click)="showModal = false">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Titre</label>
        <input type="text" [(ngModel)]="nouveauTicket.title" placeholder="Décrivez le problème en une ligne" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="nouveauTicket.description" placeholder="Détails du problème..." rows="4"></textarea>
      </div>
      <div class="form-group">
        <label>Priorité</label>
        <select [(ngModel)]="nouveauTicket.priority">
          <option value="FAIBLE">Faible</option>
          <option value="NORMALE">Normale</option>
          <option value="HAUTE">Haute</option>
          <option value="URGENTE">Urgente</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="showModal = false">Annuler</button>
      <button class="btn-primary" (click)="creerTicket()" [disabled]="!nouveauTicket.title">Créer le ticket</button>
    </div>
  </div>
</div>
